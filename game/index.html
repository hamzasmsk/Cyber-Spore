<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Neon Swarm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="game.css">
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="bars">
      <div class="bar hp"><i id="hpFill"></i><span id="hpTxt">100</span></div>
      <div class="bar xp"><i id="xpFill"></i><span id="lvTxt">Sv 1</span></div>
    </div>
    <button id="pauseBtn" class="icon-btn" aria-label="Duraklat">❚❚</button>
  </div>
  <div class="hud-stats">
    <span id="timeTxt">0:00</span>
    <span>💀 <b id="killTxt">0</b></span>
    <span>🪙 <b id="coinTxt">0</b></span>
  </div>
  <div id="bossBar" class="hidden"><div class="boss-name" id="bossName"></div><div class="bar boss"><i id="bossFill"></i></div></div>
  <div id="banner"></div>
</div>

<!-- Main menu -->
<section id="menu" class="screen">
  <div class="panel center">
    <div class="logo">NEON<br><em>SWARM</em></div>
    <p class="tag">Neon sürülere karşı hayatta kalma nişancısı</p>
    <div class="coins">🪙 <b class="coinTotal">0</b></div>
    <button class="btn primary" data-go="stages">OYNA</button>
    <button class="btn" data-go="chars">KARAKTERLER</button>
    <button class="btn" data-go="shop">GELİŞTİRMELER</button>
    <button class="btn ghost" id="soundBtn">Ses: Açık</button>
    <p class="hint">Hareket: ekrana dokun ve sürükle (masaüstü: WASD). Ateş otomatik.</p>
  </div>
</section>

<section id="stages" class="screen hidden">
  <div class="panel">
    <div class="head"><button class="back" data-go="menu">‹</button><h2>Bölümler</h2><div class="coins small">🪙 <b class="coinTotal">0</b></div></div>
    <div id="stageList" class="list"></div>
  </div>
</section>

<section id="chars" class="screen hidden">
  <div class="panel">
    <div class="head"><button class="back" data-go="menu">‹</button><h2>Karakterler</h2><div class="coins small">🪙 <b class="coinTotal">0</b></div></div>
    <div id="charList" class="list"></div>
  </div>
</section>

<section id="shop" class="screen hidden">
  <div class="panel">
    <div class="head"><button class="back" data-go="menu">‹</button><h2>Kalıcı Geliştirmeler</h2><div class="coins small">🪙 <b class="coinTotal">0</b></div></div>
    <div id="shopList" class="list"></div>
  </div>
</section>

<section id="levelup" class="screen hidden dim">
  <div class="panel center">
    <h2 class="glow">SEVİYE ATLADIN!</h2>
    <p class="tag">Bir güç seç</p>
    <div id="upgList" class="upg-list"></div>
    <button id="rerollBtn" class="btn ghost small">Yenile (1)</button>
  </div>
</section>

<section id="pause" class="screen hidden dim">
  <div class="panel center">
    <h2>Duraklatıldı</h2>
    <div id="pauseUpgs" class="chips"></div>
    <button class="btn primary" id="resumeBtn">DEVAM</button>
    <button class="btn" id="quitBtn">ANA MENÜ</button>
  </div>
</section>

<section id="over" class="screen hidden dim">
  <div class="panel center">
    <h2 id="overTitle">ÖLDÜN</h2>
    <div class="results">
      <div><span>Süre</span><b id="rTime">0:00</b></div>
      <div><span>Öldürme</span><b id="rKills">0</b></div>
      <div><span>Seviye</span><b id="rLevel">1</b></div>
      <div><span>Altın</span><b id="rCoins">0</b></div>
    </div>
    <p id="overNote" class="tag"></p>
    <button class="btn primary" id="againBtn">TEKRAR</button>
    <button class="btn" id="nextBtn">SONRAKİ BÖLÜM</button>
    <button class="btn ghost" id="menuBtn">ANA MENÜ</button>
  </div>
</section>

<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
