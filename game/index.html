<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131b1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Shuriken Squad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="features/features-a.css">
<link rel="stylesheet" href="features/features-b.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="top">
    <div class="pbar"><i id="subFill"></i><span id="subPct">0%</span></div>
    <div class="toprow">
      <button class="tilebtn" id="soundBtn" aria-label="Ayarlar"><img src="assets/ui/ic_gear.png" alt=""></button>
      <div class="nodes" id="nodes"></div>
      <div class="wallet">
        <div class="chip money"><img src="assets/ui/coin.png" alt=""><b id="money">0</b></div>
        <div class="chip gems"><img src="assets/ui/gem.png" alt=""><b id="gems">0</b></div>
      </div>
    </div>
    <div class="stagerow">
      <button class="pill" id="autoBtn"><img src="assets/ui/ic_auto.png" alt=""><span>OTO</span></button>
      <div class="stage" id="stageLbl">Bambu Vadisi · 1-1</div>
      <button class="pill boss" id="bossBtn"><img id="bossBtnImg" src="assets/ui/boss_GiantSlime2.png" alt=""><span>BOSS</span></button>
    </div>
    <div id="bossHud" class="hidden">
      <img id="bossImg" src="assets/ui/boss_GiantSlime2.png" alt="">
      <div class="bossbar"><i id="bossFill"></i><span id="bossHpTxt"></span></div>
      <div class="btimer" id="bossTime">30</div>
    </div>
  </div>

  <div class="side left">
    <button class="sbtn" data-open="rebirth"><img src="assets/ui/ic_rebirth.png" alt=""><span>Doğuş</span></button>
    <button class="sbtn" data-open="guns"><img class="gunico" src="assets/ui/wi_Shuriken.png" alt=""><span>Silah</span></button>
    <button class="sbtn" data-open="team"><img src="assets/ui/ic_team.png" alt=""><span>Takım</span></button>
  </div>
  <div class="side right">
  </div>

  <div class="cards">
    <button class="ucard" data-up="power"><div class="lbl"><img src="assets/ui/ic_power.png" alt=""><span>Güç</span><small>Sv.<b class="lv">0</b></small></div><div class="val">0</div><div class="cost"><img src="assets/ui/coin.png" alt=""><b>0</b></div></button>
    <button class="ucard" data-up="speed"><div class="lbl"><img src="assets/ui/ic_rate.png" alt=""><span>Hız</span><small>Sv.<b class="lv">0</b></small></div><div class="val">0</div><div class="cost"><img src="assets/ui/coin.png" alt=""><b>0</b></div></button>
    <button class="ucard" data-up="money"><div class="lbl"><img src="assets/ui/ic_money.png" alt=""><span>Para</span><small>Sv.<b class="lv">0</b></small></div><div class="val">0</div><div class="cost"><img src="assets/ui/coin.png" alt=""><b>0</b></div></button>
  </div>
  <button id="ultBtn" aria-label="Shuriken Fırtınası"><i></i><img src="assets/ui/wi_ShurikenMagic.png" alt=""><span>Fırtına</span></button>
  <div id="ctrl"><i></i><span>Otomatik</span></div>
  <div id="tut" class="hidden"><span></span><b></b></div>
  <div id="hint">Sürükle: kontrol sende</div>
  <div id="banner"></div>
  <div id="toast"></div>
</div>

<section id="panel" class="screen hidden">
  <div class="panel pop">
    <div class="ribbon" id="pTitle">Silah</div>
    <button class="rbtn red pclose" id="pClose" aria-label="Kapat"><img src="assets/ui/x.png" alt=""></button>
    <div id="pBody"></div>
  </div>
</section>

<section id="loading" class="screen"><img src="assets/ui/shuriken.png" alt=""><div class="loading-txt">Yükleniyor…</div></section>

<script src="assets/atlas.js"></script>
<script src="assets/sfx.js"></script>
<script src="game.js"></script>
<script src="features/missions.js"></script>
<script src="features/mine.js"></script>
<script src="features/piggy.js"></script>
<script src="features/boosts.js"></script>
<script src="features/shop.js"></script>
<script src="features/skins.js"></script>
<script src="features/settings.js"></script>
<script src="features/layout.js"></script>
<script>
if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
