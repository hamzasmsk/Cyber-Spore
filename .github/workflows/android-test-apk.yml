# Builds an installable test APK on every push to the game's branches (no secrets needed).
# Download it from the run's Artifacts, copy to an Android phone and open it to install (allow "unknown sources").
name: Shuriken Squad test APK

on:
  push:
    branches: ['claude/**', 'main']
    paths: ['game/**', '.github/workflows/android-test-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (preinstalled on the runner)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls "$ANDROID_HOME"
      - run: npm install --no-audit --no-fund
      - run: |
          npm run build
          npx cap sync android
      - name: Build debug APK
        working-directory: game/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: shuriken-squad-test-apk
          path: game/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
