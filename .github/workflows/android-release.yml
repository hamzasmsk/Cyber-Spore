# Builds the signed Android App Bundle (.aab) for Google Play in the cloud: no Android Studio or Mac needed.
# Run it from GitHub: Actions > "Shuriken Squad Android" > Run workflow. The .aab appears under the run's Artifacts.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   the upload key (.jks) encoded as base64
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (upload)
#   ANDROID_KEY_PASSWORD      key password
# Optional, to upload straight to the Play Console internal testing track:
#   PLAY_SERVICE_ACCOUNT_JSON a Google Play service account key (JSON)
name: Shuriken Squad Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to players (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      upload_track:
        description: 'Upload to Google Play track (needs PLAY_SERVICE_ACCOUNT_JSON); "none" = only build'
        required: true
        default: 'none'
        type: choice
        options: [none, internal, alpha]

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.event.inputs.version_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (preinstalled on the runner)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls "$ANDROID_HOME"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web game and copy it into the Android project
        run: |
          sed -i "s/devTools: true/devTools: false/" monetize.config.js   # no test panel in the store build
          grep -q "devTools: false" monetize.config.js
          npm run build
          npx cap sync android

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed App Bundle
        working-directory: game/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Keep the bundle
        uses: actions/upload-artifact@v5
        with:
          name: shuriken-squad-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: game/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play
        if: ${{ github.event.inputs.upload_track != 'none' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.shurikensquad.game
          releaseFiles: game/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.upload_track }}
          status: draft
